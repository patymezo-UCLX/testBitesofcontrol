<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Library - Bites of Control</title>

  <style>

    /* =====================================================
       GENERAL
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f5e7d3,
          #efe2d1
        );
    }


    /* =====================================================
       EXIT BUTTON
    ===================================================== */

    .exit-button {
      position: fixed;

      top: 24px;
      right: 24px;

      width: 56px;
      height: 56px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 4px solid #f5b444;
      border-radius: 50%;

      background: #d83a8f;
      color: white;

      font-size: 31px;
      font-weight: bold;
      line-height: 1;

      cursor: pointer;

      box-shadow:
        0 4px 0 #98305e;

      z-index: 100;

      transition:
        transform 0.15s ease;
    }

    .exit-button:hover {
      transform: scale(1.06);
    }

    .exit-button:active {
      transform: scale(0.94);
    }


    /* =====================================================
       MAIN PANEL
    ===================================================== */

    .library-panel {
      width: min(820px, 92vw);

      padding: 60px;

      background:
        rgba(255, 255, 255, 0.92);

      border-radius: 44px;

      text-align: center;

      box-shadow:
        0 18px 45px
        rgba(80, 51, 67, 0.12);
    }


    /* =====================================================
       TITLE
    ===================================================== */

    h1 {
      margin-bottom: 30px;

      color: #74496b;

      font-size:
        clamp(
          46px,
          7vw,
          82px
        );

      font-weight: 900;

      letter-spacing: 1px;
    }


    /* =====================================================
       DESCRIPTION
    ===================================================== */

    .library-description {
      max-width: 650px;

      margin:
        0 auto 42px;

      color: #60445a;

      font-size:
        clamp(
          16px,
          2vw,
          21px
        );

      line-height: 1.65;

      font-weight: 600;
    }


    /* =====================================================
       EXPLORE BUTTON
    ===================================================== */

    .explore-button {
      min-width: 170px;

      padding:
        14px 38px;

      border: none;
      border-radius: 30px;

      background: #c35291;

      color: white;

      font-size: 19px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 5px 0
        #8f3b6d;

      transition:
        transform 0.15s ease;
    }

    .explore-button:hover {
      transform:
        translateY(-2px)
        scale(1.03);
    }

    .explore-button:active {
      transform:
        translateY(2px);
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 700px) {

      body {
        padding: 20px;
      }

      .library-panel {
        width: 100%;

        padding:
          50px 24px;

        border-radius: 34px;
      }

      .exit-button {
        top: 15px;
        right: 15px;

        width: 48px;
        height: 48px;

        font-size: 26px;

        border-width: 3px;
      }

      h1 {
        margin-bottom: 24px;
      }

      .library-description {
        margin-bottom: 34px;

        font-size: 16px;
      }

      .explore-button {
        width: 100%;

        max-width: 240px;
      }

    }

  </style>
</head>


<body>


  <!-- ===================================================
       EXIT TO MAP
  ==================================================== -->

  <button
    class="exit-button"
    type="button"
    aria-label="Exit Library"
    onclick="exitLibrary()">

    ×

  </button>


  <!-- ===================================================
       LIBRARY WELCOME
  ==================================================== -->

  <main class="library-panel">


    <h1>
      LIBRARY
    </h1>


    <p class="library-description">

      Welcome to the Library.

      <br><br>

      This is a space to slow down,
      explore your thoughts,
      and practice a kinder way
      of relating to yourself.

    </p>


    <button
      class="explore-button"
      type="button"
      onclick="openLevels()">

      Explore

    </button>


  </main>


  <script>

    /* =====================================================
       GO TO LIBRARY LEVELS
    ===================================================== */

    function openLevels() {

      window.location.href =
        "levels.html";

    }


    /* =====================================================
       EXIT LIBRARY → MAIN MAP
    ===================================================== */

    function exitLibrary() {

      window.location.href =
        "../index.html";

    }

  </script>


</body>
</html>
