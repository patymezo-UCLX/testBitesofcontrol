<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bakery - Bites of Control</title>


  <style>

    /* =====================================================
       GENERAL
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {
      width: 100vw;
      height: 100vh;

      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background: #f7c7b5;
    }


    /* =====================================================
       EXIT BUTTON
    ===================================================== */

    .exit-button {
      position: fixed;

      top: 24px;
      right: 24px;

      width: 56px;
      height: 56px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 4px solid #f5b444;
      border-radius: 50%;

      background: #d83a8f;
      color: white;

      font-size: 31px;
      font-weight: bold;
      line-height: 1;

      cursor: pointer;

      box-shadow: 0 4px 0 #98305e;

      z-index: 9999;

      transition:
        transform 0.15s ease;
    }


    .exit-button:hover {
      transform: scale(1.06);
    }


    .exit-button:active {
      transform: scale(0.94);
    }


    /* =====================================================
       PANEL
    ===================================================== */

    .panel {
      width: min(700px, 85%);

      padding: 50px;

      background:
        rgba(255, 255, 255, 0.85);

      border-radius: 40px;

      text-align: center;
    }


    /* =====================================================
       TITLE
    ===================================================== */

    h1 {
      margin-bottom: 25px;

      color: #e83f78;

      font-size:
        clamp(
          42px,
          7vw,
          80px
        );
    }


    /* =====================================================
       DESCRIPTION
    ===================================================== */

    p {
      margin-bottom: 35px;

      color: #71334a;

      font-size:
        clamp(
          16px,
          2vw,
          22px
        );

      line-height: 1.5;
    }


    /* =====================================================
       EXPLORE BUTTON
    ===================================================== */

    .play-button {
      padding: 14px 40px;

      border: none;
      border-radius: 30px;

      background: #e83f78;
      color: white;

      font-size: 20px;
      font-weight: bold;

      cursor: pointer;

      transition:
        transform 0.15s ease;
    }


    .play-button:hover {
      transform: scale(1.05);
    }


    .play-button:active {
      transform: scale(0.96);
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 700px) {

      .panel {
        width: 90%;

        padding:
          45px 25px;

        border-radius: 30px;
      }


      .exit-button {
        top: 15px;
        right: 15px;

        width: 48px;
        height: 48px;

        border-width: 3px;

        font-size: 26px;
      }

    }

  </style>

</head>


<body>


  <!-- ===================================================
       EXIT BAKERY → MAP
  ==================================================== -->

  <button
    class="exit-button"
    type="button"
    onclick="exitBakery()"
    aria-label="Exit Bakery"
  >

    ×

  </button>


  <!-- ===================================================
       BAKERY INTRO
  ==================================================== -->

  <div class="panel">


    <h1>
      BAKERY
    </h1>


    <p>

      Welcome to the Bakery!

      <br>

      Complete the activities and explore each level.

    </p>


    <button
      class="play-button"
      type="button"
      onclick="goToLevels()"
    >

      Explore

    </button>


  </div>


  <script>

    /* =====================================================
       EXPLORE → BAKERY LEVELS
    ===================================================== */

    function goToLevels() {

      window.location.href =
        "levels.html";

    }


    /* =====================================================
       EXIT → MAIN MAP
    ===================================================== */

    function exitBakery() {

      window.location.href =
        "../Index.html";

    }

  </script>


</body>

</html>
