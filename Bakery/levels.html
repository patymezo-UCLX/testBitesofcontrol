<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Bakery Levels - Bites of Control</title>


  <style>

    /* =====================================================
       GENERAL
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html, body {
      min-height: 100%;
    }


    body {
      width: 100%;
      min-height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      overflow-x: hidden;
      overflow-y: auto;

      padding:
        max(28px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

      font-family: Arial, sans-serif;

      position: relative;
    }


    /* =====================================================
       BACKGROUND — suelo de madera
       Se ve directamente detrás de las tarjetas: sin panel
       blanco/crema ni overlay encima.
       background-size: cover nunca deforma la textura, solo
       recorta para llenar el viewport.
    ===================================================== */

    .bakery-levels-bg {
      position: fixed;
      inset: 0;

      background-image: url("assets/bakery-levels-bg.jpg");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;

      z-index: 0;
    }


    /* =====================================================
       CONTENT WRAPPER
       (layout only — no background, no border, no shadow)
    ===================================================== */

    .levels-content {
      position: relative;
      z-index: 1;

      width: min(1100px, 96vw);

      display: flex;
      flex-direction: column;
      align-items: center;

      margin: clamp(10px, 3vh, 40px) auto;
    }


    /* =====================================================
       LEVEL GRID
       Desktop: 3 columns x 2 rows.
       Tablet:  2 columns.
       Mobile:  2 columns, 1 if especially narrow.
    ===================================================== */

    .levels-grid {
      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap: clamp(16px, 2.6vw, 28px);
    }


    /* =====================================================
       LEVEL CARDS
    ===================================================== */

    .level-card {
      position: relative;

      aspect-ratio: 3 / 2;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1.2vw, 12px);

      padding: clamp(14px, 2.4vw, 22px);

      border: none;
      border-radius: clamp(18px, 2.4vw, 26px);

      background: #f3c94a;

      cursor: pointer;

      box-shadow:
        0 6px 0 #d8a92e;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }


    .level-card:hover {
      transform:
        translateY(-3px);
    }


    .level-card:active {
      transform:
        translateY(3px);

      box-shadow:
        0 3px 0 #d8a92e;
    }


    .level-card .level-art {
      width: 80%;
      height: 80%;
      object-fit: contain;

      pointer-events: none;
    }


    /* =====================================================
       "PRÓXIMAMENTE" (reserved, not-yet-developed) CARDS
       — visually reserved, never a padlock, never a dead link
    ===================================================== */

    .level-card.pending {
      background: #f7e2ab;

      cursor: default;

      box-shadow:
        0 6px 0 #ddc484;
    }


    .level-card.pending:hover {
      transform: none;
    }


    .level-card.pending .level-art {
      width: 68%;
      height: 68%;
    }


    .level-card .level-soon-label {
      color: #a9744f;

      font-size: clamp(13px, 1.6vw, 17px);
      font-weight: bold;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      text-align: center;
    }


    /* =====================================================
       BACK BUTTON
    ===================================================== */

    .back-button {
      margin-top: clamp(24px, 3.5vw, 36px);

      padding:
        clamp(10px, 1.6vw, 12px) clamp(24px, 3.5vw, 28px);

      border: 3px solid #f5c451;
      border-radius: 25px;

      background: #d63f93;

      color: white;

      font-size: clamp(15px, 1.7vw, 17px);
      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 5px 0 #4f1a40;

      transition:
        transform 0.15s ease;
    }


    .back-button:hover {
      transform:
        translateY(-2px);
    }


    .back-button:active {
      transform:
        translateY(2px);

      box-shadow: 0 2px 0 #4f1a40;
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    /* tablet */
    @media (max-width: 900px) {

      .levels-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }


    /* mobile */
    @media (max-width: 600px) {

      .levels-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }


    /* especially narrow phones */
    @media (max-width: 380px) {

      .levels-grid {
        grid-template-columns: 1fr;
      }

      .level-card {
        aspect-ratio: 16 / 10;
      }

    }

  </style>

</head>


<body>


  <!-- ===================================================
       BACKGROUND — suelo de madera
  ==================================================== -->

  <div class="bakery-levels-bg" aria-hidden="true"></div>


  <div class="levels-content">


    <!-- =================================================
         LEVELS (rendered from data — see LEVELS below)
    ================================================== -->

    <div
      class="levels-grid"
      id="levelsGrid"
    ></div>


    <!-- =================================================
         BACK
    ================================================== -->

    <button
      class="back-button"
      type="button"
      onclick="goBack()"
    >

      ← Volver

    </button>


  </div>


  <script>

    /* =====================================================
       TESTING MODE
       -----------------------------------------------------
       While true, every implemented level renders unlocked
       regardless of progress: no locks shown, no previous
       level required, direct access to anything built.
       Set to false to restore real unlock enforcement once
       the game is ready — isLevelUnlocked() below is the
       real check and is left intact on purpose.
    ===================================================== */

    const TESTING_MODE = true;


    /* =====================================================
       LEVELS
       -----------------------------------------------------
       status: 'ready'   -> implemented, has a real route
               'pending' -> reserved slot, not yet built,
                            no route (never a fake link)

       Exact order requested: Etiquetas Imperfectas,
       Bakery Delivery, Utensilios Inquietos (the real game
       previously labeled "Kitchen Puzzle" — same route,
       Kitchen/index.html, only its display name/art changed),
       then Manchas Escondidas, then two generic
       "Próximamente" slots.
    ===================================================== */

    const LEVELS = [
      {
        id: "labels",
        name: "Etiquetas Imperfectas",
        status: "ready",
        href: "Labels/index.html",
        art: "assets/title-labels.png"
      },
      {
        id: "delivery",
        name: "Bakery Delivery",
        status: "ready",
        href: "Delivery/index.html",
        art: "assets/title-delivery.png"
      },
      {
        id: "kitchen",
        name: "Utensilios Inquietos",
        status: "ready",
        href: "Kitchen/index.html",
        art: "assets/title-utensilios-inquietos.png"
      },
      {
        id: "manchas-escondidas",
        name: "Manchas Escondidas",
        status: "ready",
        href: "Manchas%20Escondidas/index.html",
        art: "assets/title-manchas-escondidas.png"
      },
      {
        id: "proximo-5",
        name: "Próximamente",
        status: "pending",
        href: null,
        art: null
      },
      {
        id: "proximo-6",
        name: "Próximamente",
        status: "pending",
        href: null,
        art: null
      }
    ];


    /* =====================================================
       REAL UNLOCK LOGIC (kept for when testing mode ends)
       -----------------------------------------------------
       First level always open; each following level needs
       the previous one marked complete in localStorage.
       Nothing currently writes to "bakeryLevelProgress" —
       this is the hook future completion tracking can use.
    ===================================================== */

    function isLevelUnlocked(levelIndex) {

      if (TESTING_MODE) {
        return true;
      }

      if (levelIndex === 0) {
        return true;
      }

      let progress = {};

      try {
        progress =
          JSON.parse(
            localStorage.getItem("bakeryLevelProgress")
          ) || {};
      } catch (e) {
        progress = {};
      }

      const previousLevel = LEVELS[levelIndex - 1];

      return Boolean(progress[previousLevel.id]);

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderLevels() {

      const grid = document.getElementById("levelsGrid");
      grid.innerHTML = "";

      LEVELS.forEach(function (level, index) {

        const isReady = level.status === "ready";
        const unlocked = isReady && isLevelUnlocked(index);

        const card = document.createElement(isReady ? "button" : "div");
        card.className =
          "level-card" + (isReady ? "" : " pending");
        if (isReady) {
          card.type = "button";
        }

        if (isReady && unlocked) {
          card.addEventListener("click", function () {
            window.location.href = level.href;
          });
        }

        if (level.art) {
          const img = document.createElement("img");
          img.className = "level-art";
          img.src = level.art;
          img.alt = level.name;
          card.appendChild(img);
        }

        if (!isReady) {
          const soon = document.createElement("span");
          soon.className = "level-soon-label";
          soon.textContent = "Próximamente";
          card.appendChild(soon);
        }

        if (!level.art && isReady) {
          // safety net only — every real level ships with art
          const name = document.createElement("span");
          name.className = "level-soon-label";
          name.textContent = level.name;
          card.appendChild(name);
        }

        grid.appendChild(card);

      });

    }

    renderLevels();


    /* =====================================================
       BACK TO BAKERY INTRO
    ===================================================== */

    function goBack() {

      window.location.href =
        "index.html";

    }

  </script>


</body>

</html>
